spring: 
  application: 
    name: api-gateway
  cloud: 
    gateway: 
      routes: 
        - id: DEPARTMENT-SERVICE
          uri: lb://DEPARTMENT-SERVICE
          predicates: 
            - Path=/dept/**
        - id: EMPLOYEE-SERVICE
          uri: lb://EMPLOYEE-SERVICE
          predicates: 
            - Path=/emp/**
    
server: 
  port: 8060
  
eureka:
  client:
    serviceUrl: 
      defaultZone: http://localhost:8761/eureka/
